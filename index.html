<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>生日快乐 ❤️</title>

  <style>

    /* =========================
       全局
    ========================= */

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family:
        "PingFang SC",
        "Microsoft YaHei",
        system-ui,
        sans-serif;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(255,255,255,.45),
          transparent 28%
        ),
        radial-gradient(
          circle at 80% 30%,
          rgba(255,255,255,.25),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #ff8fb1 0%,
          #ff5d8f 45%,
          #d94075 100%
        );

      color: white;
    }


    body {
      min-height: 100vh;

      display: grid;

      place-items: center;

      position: relative;

      padding: 28px 16px;
    }



    /* =========================
       第一幕：倒计时
    ========================= */

    .countdown-screen {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        radial-gradient(
          circle,
          #ff94b7,
          #ef4c83
        );

      transition: opacity 1s ease;

    }


    .countdown-number {

      font-size: clamp(
        130px,
        30vw,
        300px
      );

      font-weight: 900;

      color: white;

      text-shadow:

        0 0 20px
        rgba(255,255,255,.8),

        0 0 50px
        rgba(255,255,255,.4);

      animation: countPop .9s ease;

    }


    @keyframes countPop {

      0% {

        transform: scale(.3);

        opacity: 0;

      }

      45% {

        transform: scale(1.25);

        opacity: 1;

      }

      100% {

        transform: scale(1);

        opacity: 1;

      }

    }



    /* =========================
       第二幕：蛋糕
    ========================= */


    .cake-screen {

      position: fixed;

      inset: 0;

      z-index: 90;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background:

        radial-gradient(
          circle at center,
          #ffabc4,
          #e7437b
        );

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 1.2s ease,
        visibility 1.2s ease;

    }


    .cake-screen.show {

      opacity: 1;

      visibility: visible;

    }


    /* Happy Birthday 艺术字 */


    .birthday-title {

      margin-bottom: 50px;

      text-align: center;

      font-family:

        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: clamp(
        55px,
        12vw,
        110px
      );

      font-weight: bold;

      letter-spacing: 3px;

      color: white;

      text-shadow:

        0 5px 10px
        rgba(130,0,50,.25),

        0 0 20px
        rgba(255,255,255,.7);

      animation: titleAppear 1.8s ease;

    }


    @keyframes titleAppear {

      from {

        opacity: 0;

        transform:
          translateY(-40px)
          scale(.8);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }



    /* =========================
       蛋糕
    ========================= */


    .cake {

      width: 270px;

      height: 230px;

      position: relative;

      animation:
        cakeAppear
        1.5s
        ease;

    }


    @keyframes cakeAppear {

      from {

        opacity: 0;

        transform:
          translateY(100px)
          scale(.7);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }



    /* 最底层蛋糕 */


    .cake-bottom {

      position: absolute;

      width: 260px;

      height: 80px;

      left: 5px;

      bottom: 0;

      border-radius:

        20px
        20px
        30px
        30px;

      background:

        linear-gradient(
          #ffb1c8,
          #ff709d
        );

      box-shadow:

        0 15px 30px
        rgba(100,0,40,.25);

    }



    /* 中层 */


    .cake-middle {

      position: absolute;

      width: 210px;

      height: 65px;

      left: 30px;

      bottom: 70px;

      border-radius: 18px;

      background:

        linear-gradient(
          #ffc2d4,
          #ff82a8
        );

    }



    /* 顶层 */


    .cake-top {

      position: absolute;

      width: 160px;

      height: 55px;

      left: 55px;

      bottom: 125px;

      border-radius: 18px;

      background:

        linear-gradient(
          #ffd5e1,
          #ff9ab8
        );

    }



    /* 奶油 */


    .cream {

      position: absolute;

      width: 160px;

      height: 22px;

      left: 55px;

      bottom: 164px;

      border-radius: 50%;

      background: white;

      box-shadow:

        0 5px 10px
        rgba(100,0,40,.15);

    }



    /* 蜡烛 */


    .candle {

      position: absolute;

      width: 16px;

      height: 55px;

      left: 127px;

      bottom: 182px;

      border-radius: 5px;

      background:

        repeating-linear-gradient(
          45deg,
          white,
          white 7px,
          #ff4e88 7px,
          #ff4e88 14px
        );

    }



    /* 火焰 */


    .flame {

      position: absolute;

      width: 22px;

      height: 32px;

      left: 124px;

      bottom: 233px;

      border-radius:

        50% 50%
        50% 50%;

      background:

        radial-gradient(
          circle at 50% 70%,
          #fff7aa,
          #ffd54d 40%,
          #ff8c00 70%
        );

      transform-origin: center bottom;

      animation:
        flameMove
        .45s
        infinite
        alternate;

      filter:

        drop-shadow(
          0 0 12px
          #ffd54d
        );

    }


    @keyframes flameMove {

      from {

        transform:
          rotate(-5deg)
          scale(1);

      }

      to {

        transform:
          rotate(6deg)
          scale(.9, 1.1);

      }

    }



    /* =========================
       第三幕：生日贺卡
    ========================= */


    .glow {

      position: fixed;

      inset: 0;

      pointer-events: none;

      background:

        radial-gradient(
          circle at center,
          rgba(255,255,255,.18),
          transparent 55%
        );

    }



    .card {

      width:
        min(
          760px,
          94vw
        );

      position: relative;

      z-index: 2;

      text-align: center;

      padding:

        44px
        28px
        36px;

      border:

        1px solid
        rgba(255,255,255,.45);

      border-radius: 28px;

      background:

        rgba(
          255,
          255,
          255,
          .14
        );

      backdrop-filter:
        blur(14px);

      -webkit-backdrop-filter:
        blur(14px);

      box-shadow:

        0 24px 70px
        rgba(83,0,34,.28);



      /* 一开始隐藏 */

      opacity: 0;

      visibility: hidden;

      transform:
        translateY(40px)
        scale(.95);

      transition:

        opacity
        1.5s ease,

        transform
        1.5s ease,

        visibility
        1.5s;

    }



    .card.show {

      opacity: 1;

      visibility: visible;

      transform:

        translateY(0)
        scale(1);

    }



    .small {

      letter-spacing: .25em;

      font-size: 14px;

      opacity: .88;

      margin-bottom: 10px;

    }



    h1 {

      margin:
        6px
        0
        10px;

      font-size:

        clamp(
          42px,
          9vw,
          82px
        );

      line-height: 1.02;

      text-shadow:

        0 6px 20px
        rgba(120,0,45,.28);

    }



    .date {

      display: inline-block;

      margin:
        8px
        0
        26px;

      padding:
        9px
        18px;

      border-radius: 999px;

      background:

        rgba(
          255,
          255,
          255,
          .18
        );

      border:

        1px solid
        rgba(
          255,
          255,
          255,
          .35
        );

      font-weight: 600;

    }



    /* 心跳 */


    .heart {

      font-size: 54px;

      display: inline-block;

      animation:

        beat
        1.05s
        infinite
        ease-in-out;

      filter:

        drop-shadow(
          0 5px 12px
          rgba(120,0,40,.28)
        );

    }



    @keyframes beat {

      0%,100% {

        transform:
          scale(1);

      }

      25% {

        transform:
          scale(1.12);

      }

      40% {

        transform:
          scale(.96);

      }

      60% {

        transform:
          scale(1.16);

      }

    }



    .message {

      max-width: 610px;

      margin:
        18px
        auto
        0;

      font-size:

        clamp(
          17px,
          3.4vw,
          21px
        );

      line-height: 1.9;

    }



    .signature {

      margin-top: 28px;

      font-size: 15px;

      opacity: .9;

    }



    /* 按钮 */


    .btn {

      margin-top: 24px;

      border: 0;

      padding:
        12px
        22px;

      border-radius: 999px;

      background: white;

      color: #d93e73;

      font-weight: 700;

      font-size: 16px;

      cursor: pointer;

      box-shadow:

        0 10px 24px
        rgba(108,0,38,.18);

      transition:

        transform .2s ease,
        box-shadow .2s ease;

    }



    .btn:hover {

      transform:
        translateY(-2px);

      box-shadow:

        0 14px 30px
        rgba(108,0,38,.24);

    }



    /* 隐藏的话 */


    .hidden-note {

      max-height: 0;

      opacity: 0;

      overflow: hidden;

      transition:

        max-height .8s ease,
        opacity .8s ease,
        margin-top .8s ease;

      margin-top: 0;

      font-size: 18px;

      line-height: 1.8;

    }



    .hidden-note.show {

      max-height: 260px;

      opacity: 1;

      margin-top: 22px;

    }



    /* =========================
       飘动爱心
    ========================= */


    .floating-heart {

      position: fixed;

      bottom: -40px;

      z-index: 1;

      pointer-events: none;

      animation:
        floatUp
        linear
        forwards;

      user-select: none;

      filter:

        drop-shadow(
          0 3px 8px
          rgba(120,0,45,.18)
        );

    }



    @keyframes floatUp {

      from {

        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;

      }

      10% {

        opacity: .95;

      }

      to {

        transform:

          translateY(-115vh)
          rotate(360deg);

        opacity: 0;

      }

    }



    /* 闪光 */


    .sparkle {

      position: absolute;

      pointer-events: none;

      font-size: 20px;

      animation:

        twinkle
        1.8s
        infinite
        ease-in-out;

    }



    .s1 {

      top: 18px;

      left: 24px;

    }


    .s2 {

      top: 34px;

      right: 32px;

      animation-delay: .8s;

    }


    .s3 {

      bottom: 26px;

      left: 36px;

      animation-delay: .45s;

    }


    .s4 {

      bottom: 30px;

      right: 30px;

      animation-delay: 1.15s;

    }



    @keyframes twinkle {

      0%,100% {

        opacity: .35;

        transform:
          scale(.8)
          rotate(0deg);

      }

      50% {

        opacity: 1;

        transform:
          scale(1.2)
          rotate(18deg);

      }

    }



    /* 手机适配 */


    @media (
      max-width: 520px
    ) {

      .card {

        padding:

          36px
          20px
          30px;

        border-radius: 22px;

      }


      .message {

        line-height: 1.75;

      }


      .birthday-title {

        margin-bottom: 30px;

      }


      .cake {

        transform:
          scale(.85);

      }

    }

  </style>

</head>



<body>


<!-- =========================
     第一幕：321
========================= -->


<div
  class="countdown-screen"
  id="countdownScreen"
>

  <div
    class="countdown-number"
    id="countdownNumber"
  >
    3
  </div>

</div>



<!-- =========================
     第二幕：蛋糕
========================= -->


<div
  class="cake-screen"
  id="cakeScreen"
>


  <div class="birthday-title">

    Happy Birthday

  </div>



  <div class="cake">


    <div class="flame"></div>


    <div class="candle"></div>


    <div class="cream"></div>


    <div class="cake-top"></div>


    <div class="cake-middle"></div>


    <div class="cake-bottom"></div>


  </div>


</div>



<!-- =========================
     第三幕：贺卡
========================= -->


<div class="glow"></div>



<main
  class="card"
  id="birthdayCard"
>


  <span class="sparkle s1">✦</span>

  <span class="sparkle s2">✧</span>

  <span class="sparkle s3">✧</span>

  <span class="sparkle s4">✦</span>



  <div class="small">

    TO MY FAVORITE PERSON

  </div>



  <div class="heart">

    ❤️

  </div>



  <h1>

    生日快乐

  </h1>



  <div class="date">

    9月1日 · 属于你的特别一天

  </div>



  <div class="message">

    亲爱的你，

    <br>

    很幸运可以陪你走过又一岁的开始。

    <br>

    希望你的每一天都有鲜花、拥抱和好心情，

    希望你想要的都会慢慢来到你身边。

    <br>

    谢谢你出现在我的世界里。

    <br>

    <strong>

      生日快乐，我会一直爱你。❤️

    </strong>

  </div>



  <button
    class="btn"
    onclick="showLove()"
  >

    点一下，有句话想对你说

  </button>



  <div
    id="note"
    class="hidden-note"
  >

    世界很大，

    但我最想去的地方，

    是有你的未来。

    <br>

    愿往后的每一个生日，

    我都能陪在你身边。💗

  </div>



  <div class="signature">

    — 爱你的人

  </div>


</main>



<script>


  /* =========================
     321 倒计时
  ========================= */


  const countdownScreen =
    document.getElementById(
      "countdownScreen"
    );


  const countdownNumber =
    document.getElementById(
      "countdownNumber"
    );


  const cakeScreen =
    document.getElementById(
      "cakeScreen"
    );


  const birthdayCard =
    document.getElementById(
      "birthdayCard"
    );



  let number = 3;



  function nextNumber() {


    number--;


    if (number > 0) {


      countdownNumber.textContent =
        number;


      /* 重新触发动画 */


      countdownNumber.style.animation =
        "none";


      void countdownNumber.offsetWidth;


      countdownNumber.style.animation =
        "countPop .9s ease";


    }


    else {


      /* 321结束 */


      countdownScreen.style.opacity =
        "0";


      setTimeout(
        () => {


          countdownScreen.style.display =
            "none";


          /* 显示蛋糕 */


          cakeScreen.classList.add(
            "show"
          );


        },
        900
      );



      /* 蛋糕显示约4秒 */


      setTimeout(
        () => {


          cakeScreen.style.opacity =
            "0";


        },
        5000
      );



      /* 显示生日卡片 */


      setTimeout(
        () => {


          cakeScreen.style.display =
            "none";


          birthdayCard.classList.add(
            "show"
          );


          startHearts();


        },
        6200
      );


      clearInterval(
        countdownTimer
      );

    }

  }



  const countdownTimer =
    setInterval(
      nextNumber,
      1000
    );



  /* =========================
     爱心动画
  ========================= */


  function createHeart() {


    const heart =
      document.createElement(
        "div"
      );


    heart.className =
      "floating-heart";


    const hearts = [

      "❤",

      "💗",

      "💕",

      "💖",

      "💘"

    ];


    heart.textContent =

      hearts[
        Math.floor(
          Math.random()
          *
          hearts.length
        )
      ];


    heart.style.left =

      Math.random()
      *
      100
      +
      "vw";


    heart.style.fontSize =

      14
      +
      Math.random()
      *
      24
      +
      "px";


    heart.style.animationDuration =

      5
      +
      Math.random()
      *
      5
      +
      "s";


    document.body.appendChild(
      heart
    );


    setTimeout(
      () => heart.remove(),
      10000
    );

  }



  function startHearts() {


    setInterval(
      createHeart,
      380
    );


    for (
      let i = 0;
      i < 12;
      i++
    ) {


      setTimeout(
        createHeart,
        i * 120
      );


    }

  }



  /* =========================
     点击按钮
  ========================= */


  function showLove() {


    const note =
      document.getElementById(
        "note"
      );


    note.classList.toggle(
      "show"
    );


    /* 点击后爆发一波爱心 */


    for (
      let i = 0;
      i < 20;
      i++
    ) {


      setTimeout(
        createHeart,
        i * 60
      );


    }

  }


</script>


</body>

</html>
