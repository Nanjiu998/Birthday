<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>生日快乐 ❤️</title>

<!-- 中文艺术字体 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&display=swap"
    rel="stylesheet"
>


<style>

/* ==================================================
   全局
================================================== */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;
    min-height: 100%;
    overflow-x: hidden;

    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: #ffffff;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,.55),
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 30%,
            rgba(255,255,255,.30),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #e4f7ff 0%,
            #bce8ff 32%,
            #8fd3f7 66%,
            #62b8eb 100%
        );
}


body {

    min-height: 100vh;

    display: grid;

    place-items: center;

    position: relative;

    padding: 25px 16px;
}


/* ==================================================
   第一幕：倒计时
================================================== */

.countdown-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 40%,
            #f1fbff 0%,
            #d1f0ff 25%,
            #a5dcfa 55%,
            #72c1ee 82%,
            #55abe1 100%
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}


.countdown-center {

    position: relative;

    z-index: 5;

    text-align: center;
}


.countdown-tip {

    margin-bottom: 10px;

    color: #2873a7;

    font-size: 15px;

    font-weight: 600;

    letter-spacing: .22em;

    text-shadow:
        0 1px 6px rgba(255,255,255,.9);
}


.countdown-number {

    font-size:
        clamp(
            135px,
            31vw,
            300px
        );

    line-height: .95;

    font-weight: 900;

    color: #ffffff;

    text-shadow:
        0 3px 0 rgba(40,112,160,.15),
        0 8px 18px rgba(30,100,150,.25),
        0 0 35px rgba(255,255,255,.95);

    animation:
        countPop
        .9s ease;
}


@keyframes countPop {

    0% {

        opacity: 0;

        transform:
            scale(.3)
            rotate(-8deg);
    }

    45% {

        opacity: 1;

        transform:
            scale(1.18)
            rotate(3deg);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}


/* ==================================================
   倒计时装饰
================================================== */

.count-decoration {

    position: absolute;

    pointer-events: none;

    user-select: none;
}


.count-star {

    color: rgba(255,255,255,.95);

    text-shadow:
        0 0 12px rgba(255,255,255,.9);

    animation:
        decorationFloat
        3s ease-in-out
        infinite;
}


.cs1 {

    top: 13%;

    left: 12%;

    font-size: 30px;
}


.cs2 {

    top: 22%;

    right: 14%;

    font-size: 20px;

    animation-delay: .6s;
}


.cs3 {

    bottom: 18%;

    left: 16%;

    font-size: 22px;

    animation-delay: 1.2s;
}


.cs4 {

    right: 10%;

    bottom: 15%;

    font-size: 32px;

    animation-delay: .9s;
}


.count-heart {

    color: rgba(255,255,255,.9);

    font-size: 28px;

    filter:
        drop-shadow(
            0 4px 10px
            rgba(52,127,180,.18)
        );

    animation:
        heartFloat
        3.8s ease-in-out
        infinite;
}


.ch1 {

    top: 39%;

    left: 7%;
}


.ch2 {

    top: 55%;

    right: 7%;

    animation-delay: .8s;
}


.ch3 {

    top: 73%;

    left: 25%;

    font-size: 20px;

    animation-delay: 1.4s;
}


.blue-ring {

    width: 100px;

    height: 100px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,.40);

    animation:
        ringMove
        5s ease-in-out
        infinite;
}


.ring1 {

    top: 10%;

    right: 24%;
}


.ring2 {

    bottom: 8%;

    left: 12%;

    width: 65px;

    height: 65px;

    animation-delay: 1.3s;
}


.light-dot {

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 15px white,
        0 0 30px rgba(255,255,255,.8);

    animation:
        dotPulse
        2s ease-in-out
        infinite;
}


.dot1 {

    left: 24%;

    top: 19%;
}


.dot2 {

    right: 21%;

    top: 68%;

    animation-delay: .7s;
}


.dot3 {

    left: 35%;

    bottom: 9%;

    animation-delay: 1.3s;
}


@keyframes decorationFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(0deg);

        opacity: .5;
    }

    50% {

        transform:
            translateY(-15px)
            rotate(15deg);

        opacity: 1;
    }
}


@keyframes heartFloat {

    0%,
    100% {

        transform:
            translateY(0)
            scale(1);
    }

    50% {

        transform:
            translateY(-18px)
            scale(1.15);
    }
}


@keyframes ringMove {

    0%,
    100% {

        transform:
            scale(.85);

        opacity: .25;
    }

    50% {

        transform:
            scale(1.15);

        opacity: .65;
    }
}


@keyframes dotPulse {

    0%,
    100% {

        opacity: .35;

        transform:
            scale(.7);
    }

    50% {

        opacity: 1;

        transform:
            scale(1.25);
    }
}


/* ==================================================
   第二幕：蛋糕页面
================================================== */

.cake-screen {

    position: fixed;

    inset: 0;

    z-index: 90;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    padding: 25px 15px;

    background:
        radial-gradient(
            circle at 50% 35%,
            #f2fbff 0%,
            #d5f2ff 30%,
            #a4defb 58%,
            #75c4ef 82%,
            #58ade2 100%
        );

    opacity: 0;

    visibility: hidden;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}


.cake-screen.show {

    opacity: 1;

    visibility: visible;
}


/* ==================================================
   Happy Birthday 艺术字
================================================== */

.birthday-title {

    position: relative;

    z-index: 20;

    margin-bottom: 22px;

    text-align: center;

    font-family:
        "Brush Script MT",
        "Segoe Script",
        "Snell Roundhand",
        cursive;

    font-size:
        clamp(
            50px,
            10vw,
            95px
        );

    font-weight: bold;

    letter-spacing: 2px;

    color: #ffffff;

    text-shadow:
        0 3px 0 rgba(44,113,160,.20),
        0 8px 18px rgba(32,97,146,.28),
        0 0 25px rgba(255,255,255,.9);

    animation:
        titleAppear
        1.4s ease;
}


.birthday-subtitle {

    display: block;

    margin-top: 8px;

    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;

    font-size:
        clamp(
            13px,
            3vw,
            17px
        );

    font-weight: 600;

    letter-spacing: .3em;

    color: #256c9d;

    text-shadow:
        0 1px 5px
        rgba(255,255,255,.9);
}


@keyframes titleAppear {

    from {

        opacity: 0;

        transform:
            translateY(-35px)
            scale(.8);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* ==================================================
   蛋糕
================================================== */

.cake-wrapper {

    position: relative;

    z-index: 10;

    width: 330px;

    height: 315px;

    animation:
        cakeAppear
        1.6s ease;
}


@keyframes cakeAppear {

    from {

        opacity: 0;

        transform:
            translateY(80px)
            scale(.75);
    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


.plate-shadow {

    position: absolute;

    width: 250px;

    height: 28px;

    left: 40px;

    bottom: 8px;

    border-radius: 50%;

    background:
        rgba(40,100,145,.20);

    filter: blur(9px);
}


.cake-plate {

    position: absolute;

    left: 22px;

    bottom: 15px;

    width: 286px;

    height: 34px;

    border-radius: 50%;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #dff4ff
        );

    border:
        2px solid
        rgba(70,150,205,.25);

    box-shadow:
        0 8px 18px
        rgba(45,110,155,.18);
}


.cake-bottom {

    position: absolute;

    width: 270px;

    height: 84px;

    left: 30px;

    bottom: 42px;

    border-radius:
        20px
        20px
        28px
        28px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #f5fcff 36%,
            #bae6ff
        );

    border:
        2px solid
        rgba(70,155,210,.22);

    box-shadow:
        0 15px 25px
        rgba(53,110,150,.18);
}


.cake-middle {

    position: absolute;

    width: 220px;

    height: 72px;

    left: 55px;

    bottom: 116px;

    border-radius: 18px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #f7fcff 40%,
            #b4e4ff
        );

    border:
        2px solid
        rgba(70,155,210,.20);
}


.cake-top {

    position: absolute;

    width: 166px;

    height: 62px;

    left: 82px;

    bottom: 178px;

    border-radius: 17px;

    background:
        linear-gradient(
            to bottom,
            #ffffff,
            #d5f1ff
        );

    border:
        2px solid
        rgba(70,155,210,.18);
}


.top-cream {

    position: absolute;

    width: 166px;

    height: 29px;

    left: 82px;

    bottom: 220px;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        inset 0 -5px 10px
        rgba(100,180,220,.12),
        0 5px 10px
        rgba(60,130,170,.12);
}


/* ==================================================
   奶油花边
================================================== */

.lace {

    position: absolute;

    display: flex;

    justify-content: space-evenly;

    align-items: center;
}


.lace span {

    display: block;

    width: 17px;

    height: 17px;

    border-radius: 50%;

    background: #ffffff;

    box-shadow:
        0 3px 4px
        rgba(78,150,190,.12);
}


.lace-bottom {

    width: 246px;

    left: 42px;

    bottom: 109px;
}


.lace-middle {

    width: 196px;

    left: 67px;

    bottom: 171px;
}


.lace-top {

    width: 146px;

    left: 92px;

    bottom: 224px;
}


/* ==================================================
   蓝色糖珠
================================================== */

.pearl {

    position: absolute;

    width: 10px;

    height: 10px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ffffff,
            #80cbf5 52%,
            #469fd7
        );

    box-shadow:
        0 2px 5px
        rgba(40,110,160,.20);
}


.p1 { left: 58px; bottom: 71px; }

.p2 { left: 100px; bottom: 59px; }

.p3 { left: 148px; bottom: 72px; }

.p4 { right: 106px; bottom: 58px; }

.p5 { right: 61px; bottom: 70px; }

.p6 { left: 83px; bottom: 141px; }

.p7 { left: 150px; bottom: 131px; }

.p8 { right: 82px; bottom: 142px; }


/* ==================================================
   小花
================================================== */

.flower {

    position: absolute;

    width: 28px;

    height: 28px;

    z-index: 7;
}


.flower span {

    position: absolute;

    width: 13px;

    height: 13px;

    border-radius:
        70% 30%
        70% 30%;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #a7dafa
        );

    box-shadow:
        0 2px 4px
        rgba(55,120,165,.16);
}


.flower span:nth-child(1) {

    left: 1px;

    top: 7px;

    transform: rotate(45deg);
}


.flower span:nth-child(2) {

    right: 1px;

    top: 7px;

    transform: rotate(135deg);
}


.flower span:nth-child(3) {

    top: 0;

    left: 8px;

    transform: rotate(90deg);
}


.flower span:nth-child(4) {

    bottom: 0;

    left: 8px;
}


.flower::after {

    content: "";

    position: absolute;

    width: 8px;

    height: 8px;

    left: 10px;

    top: 10px;

    border-radius: 50%;

    background: #55ace0;

    box-shadow:
        0 0 5px
        rgba(69,153,210,.35);
}


.flower1 {

    left: 48px;

    bottom: 92px;
}


.flower2 {

    right: 47px;

    bottom: 92px;
}


.flower3 {

    left: 73px;

    bottom: 157px;

    transform: scale(.8);
}


.flower4 {

    right: 73px;

    bottom: 157px;

    transform: scale(.8);
}


/* ==================================================
   蜡烛
================================================== */

.candle {

    position: absolute;

    width: 16px;

    height: 58px;

    left: 157px;

    bottom: 244px;

    border-radius: 5px;

    background:
        repeating-linear-gradient(
            45deg,
            #ffffff 0,
            #ffffff 7px,
            #62b8eb 7px,
            #62b8eb 14px
        );

    box-shadow:
        0 4px 8px
        rgba(49,121,168,.20);
}


.flame {

    position: absolute;

    width: 22px;

    height: 34px;

    left: 154px;

    bottom: 298px;

    z-index: 8;

    border-radius:
        55% 55%
        50% 50%;

    background:
        radial-gradient(
            circle at 50% 72%,
            #fffbd0 0%,
            #ffe764 38%,
            #ffb72d 65%,
            #ff8a17 100%
        );

    filter:
        drop-shadow(
            0 0 12px
            rgba(255,207,72,.95)
        );

    transform-origin:
        center bottom;

    animation:
        flameMove
        .42s infinite alternate;
}


@keyframes flameMove {

    from {

        transform:
            rotate(-5deg)
            scale(1);
    }

    to {

        transform:
            rotate(6deg)
            scale(.9,1.1);
    }
}


/* ==================================================
   SVG烟花
================================================== */

.fireworks-layer {

    position: absolute;

    inset: 0;

    z-index: 5;

    pointer-events: none;

    overflow: hidden;
}


.fireworks-svg {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    overflow: visible;
}


.firework-path {

    fill: none;

    stroke-linecap: round;

    stroke-linejoin: round;
}


.firework-spark-circle {

    pointer-events: none;
}


/* ==================================================
   蛋糕页开启贺卡按钮
================================================== */

.open-card-button {

    position: relative;

    z-index: 25;

    min-height: 50px;

    margin-top: 4px;

    padding:
        13px
        28px;

    border:
        1px solid
        rgba(255,255,255,.9);

    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.96),
            rgba(223,246,255,.94)
        );

    color: #2e7faf;

    font-size: 16px;

    font-weight: 700;

    letter-spacing: .04em;

    cursor: pointer;

    box-shadow:
        0 10px 26px
        rgba(43,108,153,.22),
        inset 0 1px 0
        rgba(255,255,255,.9);

    transition:
        transform .25s ease,
        box-shadow .25s ease;

    animation:
        buttonFloat
        2s ease-in-out
        infinite;
}


.open-card-button::before {

    content: "✦";

    margin-right: 8px;
}


.open-card-button::after {

    content: "✦";

    margin-left: 8px;
}


.open-card-button:hover {

    transform:
        translateY(-3px)
        scale(1.03);

    box-shadow:
        0 15px 32px
        rgba(43,108,153,.28);
}


.open-card-button:active {

    transform: scale(.98);
}


.open-card-button:disabled {

    cursor: default;

    opacity: .9;
}


@keyframes buttonFloat {

    0%,
    100% {

        box-shadow:
            0 10px 26px
            rgba(43,108,153,.22);
    }

    50% {

        box-shadow:
            0 15px 36px
            rgba(43,108,153,.38);
    }
}


.cake-screen.leave {

    opacity: 0;

    transform:
        scale(1.04);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease;
}


/* ==================================================
   第三幕：贺卡
================================================== */

.glow {

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(255,255,255,.22),
            transparent 55%
        );
}


.card {

    width:
        min(
            760px,
            94vw
        );

    position: relative;

    z-index: 2;

    text-align: center;

    padding:
        44px
        28px
        36px;

    border:
        1px solid
        rgba(255,255,255,.65);

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.28),
            rgba(91,177,229,.19)
        );

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);

    box-shadow:
        0 24px 70px
        rgba(42,101,145,.28);

    opacity: 0;

    visibility: hidden;

    transform:
        translateY(45px)
        scale(.94);

    transition:
        opacity 1.5s ease,
        transform 1.5s ease,
        visibility 1.5s ease;
}


.card.show {

    opacity: 1;

    visibility: visible;

    transform:
        translateY(0)
        scale(1);
}


.card-border {

    position: absolute;

    inset: 10px;

    border:
        1px solid
        rgba(255,255,255,.30);

    border-radius: 21px;

    pointer-events: none;
}


/* ==================================================
   贺卡顶部英文
================================================== */

.small {

    margin-bottom: 12px;

    color: #285f8e;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 14px;

    font-weight: 700;

    letter-spacing: .32em;

    text-shadow:
        0 1px 5px
        rgba(255,255,255,.9);
}


/* ==================================================
   中文艺术主标题
================================================== */

h1 {

    margin:
        8px
        0
        14px;

    font-family:
        "Ma Shan Zheng",
        "STKaiti",
        "KaiTi",
        "Kaiti SC",
        cursive;

    font-size:
        clamp(
            58px,
            11vw,
            98px
        );

    font-weight: 400;

    line-height: 1.08;

    letter-spacing: .06em;

    color: #ffffff;

    text-shadow:
        0 3px 0
        rgba(55,120,170,.16),
        0 7px 12px
        rgba(43,105,155,.20),
        0 13px 25px
        rgba(40,95,140,.20),
        0 0 18px
        rgba(255,255,255,.35);
}


/* ==================================================
   日期
================================================== */

.date {

    display: inline-block;

    margin:
        8px
        0
        30px;

    padding:
        9px
        21px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.40);

    border:
        1px solid
        rgba(255,255,255,.78);

    color: #295f8d;

    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    font-size: 17px;

    font-weight: 600;

    letter-spacing: .04em;

    text-shadow:
        0 1px 3px
        rgba(255,255,255,.8);
}


/* ==================================================
   贺卡中文正文
================================================== */

.message {

    max-width: 640px;

    margin:
        18px
        auto
        0;

    color:
        rgba(255,255,255,.98);

    font-family:
        "Noto Serif SC",
        "Songti SC",
        "STSong",
        "SimSun",
        serif;

    font-size:
        clamp(
            18px,
            3.2vw,
            22px
        );

    font-weight: 500;

    letter-spacing: .055em;

    line-height: 2.15;

    text-shadow:
        0 2px 5px
        rgba(40,90,130,.20),
        0 4px 10px
        rgba(38,90,130,.14);
}


/* ==================================================
   重点祝福文字
================================================== */

.message strong {

    display: inline-block;

    margin-top: 8px;

    font-family:
        "Ma Shan Zheng",
        "STKaiti",
        "KaiTi",
        "Kaiti SC",
        cursive;

    font-size:
        clamp(
            25px,
            4vw,
            32px
        );

    font-weight: 400;

    letter-spacing: .07em;

    color: #ffffff;

    text-shadow:
        0 2px 5px
        rgba(43,105,155,.22),
        0 5px 14px
        rgba(38,95,140,.22),
        0 0 13px
        rgba(255,255,255,.30);
}


/* ==================================================
   心跳
================================================== */

.heart {

    display: inline-block;

    font-size: 54px;

    animation:
        beat
        1.05s infinite
        ease-in-out;

    filter:
        drop-shadow(
            0 5px 12px

<script>

/* ==================================================
   获取元素
================================================== */

const countdownScreen =
    document.getElementById(
        "countdownScreen"
    );


const countdownNumber =
    document.getElementById(
        "countdownNumber"
    );


const cakeScreen =
    document.getElementById(
        "cakeScreen"
    );


const birthdayCard =
    document.getElementById(
        "birthdayCard"
    );


const openCardButton =
    document.getElementById(
        "openCardButton"
    );


const loveButton =
    document.getElementById(
        "loveButton"
    );


const fireworksLayer =
    document.getElementById(
        "fireworksLayer"
    );


const fireworksSvg =
    document.getElementById(
        "fireworksSvg"
    );


const SVG_NS =
    "http://www.w3.org/2000/svg";


/*
   烟花播放速度

   700ms = 均匀中速

   想稍快：600
   想稍慢：800
*/

const FIREWORK_INTERVAL =
    700;


/* ==================================================
   SVG尺寸
================================================== */

function resizeFireworksSvg() {

    const rect =
        fireworksLayer.getBoundingClientRect();


    fireworksSvg.setAttribute(

        "viewBox",

        `0 0 ${rect.width} ${rect.height}`

    );

}


window.addEventListener(

    "resize",

    resizeFireworksSvg

);


/* ==================================================
   321倒计时
================================================== */

let number =
    3;


function nextNumber() {

    number--;


    if (
        number > 0
    ) {

        countdownNumber.textContent =
            number;


        countdownNumber.style.animation =
            "none";


        void countdownNumber.offsetWidth;


        countdownNumber.style.animation =
            "countPop .9s ease";

    }

    else {

        clearInterval(
            countdownTimer
        );


        countdownScreen.style.opacity =
            "0";


        countdownScreen.style.visibility =
            "hidden";


        setTimeout(

            () => {

                countdownScreen.style.display =
                    "none";


                cakeScreen.classList.add(
                    "show"
                );


                resizeFireworksSvg();


                startFireworks();

            },

            700

        );

    }

}


const countdownTimer =
    setInterval(

        nextNumber,

        1000

    );


/* ==================================================
   烟花颜色
================================================== */

const fireworkPalettes = [

    [
        "#ffffff",
        "#63d8ff",
        "#3caaff",
        "#97e8ff"
    ],

    [
        "#ffffff",
        "#ff65bd",
        "#ff9bd8",
        "#ff3f91"
    ],

    [
        "#ffffff",
        "#aa75ff",
        "#d5a8ff",
        "#8456ff"
    ],

    [
        "#ffffff",
        "#ffd45b",
        "#fff0a1",
        "#ff9f43"
    ],

    [
        "#ffffff",
        "#55eed6",
        "#9ffff0",
        "#28cdbc"
    ],

    [
        "#ffffff",
        "#ff846f",
        "#ffb986",
        "#ffd152"
    ],

    [
        "#4ea8ff",
        "#ae70ff",
        "#ff68bc",
        "#ffd45b",
        "#ffffff"
    ]

];


let fireworksTimer =
    null;


/* ==================================================
   创建弧形烟花路径
================================================== */

function createCurvedPath(
    group,
    angle,
    distance,
    color,
    powerful,
    inner = false
) {


    const baseX =
        Math.cos(angle)
        *
        distance;


    const baseY =
        Math.sin(angle)
        *
        distance;


    const gravity =
        inner
        ?
        (
            13
            +
            Math.random()
            *
            16
        )
        :
        (
            powerful
            ?
            32
            +
            Math.random()
            *
            35
            :
            22
            +
            Math.random()
            *
            28
        );


    const sideBend =
        (
            Math.random()
            -
            .5
        )
        *
        (
            powerful
            ?
            34
            :
            22
        );


    const endX =
        baseX
        +
        sideBend
        *
        .25;


    const endY =
        baseY
        +
        gravity;


    const c1x =
        baseX
        *
        .26;


    const c1y =
        baseY
        *
        .20;


    const c2x =
        baseX
        *
        .72
        +
        sideBend;


    const c2y =
        baseY
        *
        .58
        +
        gravity
        *
        .58;


    const path =
        document.createElementNS(
            SVG_NS,
            "path"
        );


    path.setAttribute(

        "d",

        `
        M 0 0
        C
        ${c1x} ${c1y},
        ${c2x} ${c2y},
        ${endX} ${endY}
        `

    );


    path.setAttribute(
        "class",
        "firework-path"
    );


    path.setAttribute(
        "stroke",
        color
    );


    path.setAttribute(

        "stroke-width",

        inner
        ?
        (
            1.8
            +
            Math.random()
            *
            1.4
        )
        :
        (
            2.4
            +
            Math.random()
            *
            2.1
        )

    );


    path.style.filter =
        `
        drop-shadow(
            0 0 3px
            #ffffff
        )

        drop-shadow(
            0 0 7px
            ${color}
        )
        `;


    group.appendChild(
        path
    );


    const length =
        path.getTotalLength();


    const visibleLength =
        inner
        ?
        length * .24
        :
        length
        *
        (
            .28
            +
            Math.random()
            *
            .14
        );


    path.style.strokeDasharray =
        `${visibleLength} ${length}`;


    path.style.strokeDashoffset =
        length;


    const duration =
        inner
        ?
        (
            850
            +
            Math.random()
            *
            300
        )
        :
        (
            powerful
            ?
            1300
            +
            Math.random()
            *
            450
            :
            1150
            +
            Math.random()
            *
            420
        );


    path.animate(

        [

            {

                strokeDashoffset:
                    length,

                opacity: 0

            },

            {

                strokeDashoffset:
                    length * .78,

                opacity: 1,

                offset: .08

            },

            {

                strokeDashoffset:
                    length * .25,

                opacity: 1,

                offset: .60

            },

            {

                strokeDashoffset:
                    -visibleLength,

                opacity: 0

            }

        ],

        {

            duration: duration,

            easing:
                "cubic-bezier(.12,.58,.20,1)",

            fill:
                "forwards"

        }

    );


    const head =
        document.createElementNS(
            SVG_NS,
            "circle"
        );


    head.setAttribute(
        "cx",
        endX
    );


    head.setAttribute(
        "cy",
        endY
    );


    head.setAttribute(

        "r",

        inner
        ?
        1.4
        :
        2.2

    );


    head.setAttribute(
        "fill",
        color
    );


    head.style.filter =
        `drop-shadow(0 0 6px ${color})`;


    head.style.opacity =
        "0";


    group.appendChild(
        head
    );


    head.animate(

        [

            {
                opacity: 0
            },

            {

                opacity: 0,

                offset: .58

            },

            {

                opacity: 1,

                offset: .72

            },

            {

                opacity: 0

            }

        ],

        {

            duration: duration,

            fill:
                "forwards"

        }

    );

}


/* ==================================================
   金色碎星
================================================== */

function createFallingSpark(
    group,
    radius,
    powerful
) {


    const angle =
        Math.random()
        *
        Math.PI
        *
        2;


    const distance =
        30
        +
        Math.random()
        *
        (
            powerful
            ?
            130
            :
            90
        );


    const x =
        Math.cos(angle)
        *
        distance;


    const y =
        Math.sin(angle)
        *
        distance;


    const finalY =
        y
        +
        40
        +
        Math.random()
        *
        40;


    const spark =
        document.createElementNS(
            SVG_NS,
            "circle"
        );


    spark.setAttribute(
        "class",
        "firework-spark-circle"
    );


    spark.setAttribute(
        "cx",
        0
    );


    spark.setAttribute(
        "cy",
        0
    );


    spark.setAttribute(
        "r",
        radius
    );


    spark.setAttribute(

        "fill",

        Math.random() < .5
        ?
        "#fff8c7"
        :
        "#ffd45e"

    );


    spark.style.filter =
        `
        drop-shadow(
            0 0 4px
            #ffffff
        )

        drop-shadow(
            0 0 7px
            #ffd45e
        )
        `;


    group.appendChild(
        spark
    );


    spark.animate(

        [

            {

                transform:
                    "translate(0px,0px) scale(1)",

                opacity: 1

            },

            {

                transform:
                    `translate(
                        ${x * .55}px,
                        ${y * .50}px
                    )
                    scale(.9)`,

                opacity: .95,

                offset: .55

            },

            {

                transform:
                    `translate(
                        ${x}px,
                        ${finalY}px
                    )
                    scale(.1)`,

                opacity: 0

            }

        ],

        {

            duration:
                1100
                +
                Math.random()
                *
                700,

            easing:
                "ease-out",

            fill:
                "forwards"

        }

    );

}


/* ==================================================
   创建整朵烟花
================================================== */

function createFirework(
    customLeft = null,
    customTop = null,
    powerful = false
) {


    if (
        !cakeScreen.classList.contains(
            "show"
        )
    ) {

        return;

    }


    const rect =
        fireworksLayer.getBoundingClientRect();


    let leftPercent;


    if (
        customLeft !== null
    ) {

        leftPercent =
            customLeft;

    }

    else {

        const type =
            Math.random();


        if (
            type < .40
        ) {

            leftPercent =
                6
                +
                Math.random()
                *
                25;

        }

        else if (
            type < .80
        ) {

            leftPercent =
                69
                +
                Math.random()
                *
                25;

        }

        else {

            leftPercent =
                31
                +
                Math.random()
                *
                38;

        }

    }


    const topPercent =
        customTop !== null
        ?
        customTop
        :
        (
            8
            +
            Math.random()
            *
            43
        );


    const centerX =
        rect.width
        *
        leftPercent
        /
        100;


    const centerY =
        rect.height
        *
        topPercent
        /
        100;


    const palette =
        fireworkPalettes[
            Math.floor(
                Math.random()
                *
                fireworkPalettes.length
            )
        ];


    const group =
        document.createElementNS(
            SVG_NS,
            "g"
        );


    group.setAttribute(

        "transform",

        `translate(
            ${centerX}
            ${centerY}
        )`

    );


    fireworksSvg.appendChild(
        group
    );


    const core =
        document.createElementNS(
            SVG_NS,
            "circle"
        );


    core.setAttribute(
        "cx",
        0
    );


    core.setAttribute(
        "cy",
        0
    );


    core.setAttribute(
        "r",
        5
    );


    core.setAttribute(
        "fill",
        "#ffffff"
    );


    core.style.filter =
        `
        drop-shadow(
            0 0 8px
            #ffffff
        )

        drop-shadow(
            0 0 18px
            ${palette[1]}
        )
        `;


    group.appendChild(
        core
    );


    core.animate(

        [

            {

                r: 2,

                opacity: 1

            },

            {

                r: 12,

                opacity: .95,

                offset: .35

            },

            {

                r: 22,

                opacity: 0

            }

        ],

        {

            duration: 520,

            easing:
                "ease-out",

            fill:
                "forwards"

        }

    );


    const outerCount =
        powerful
        ?
        42
        :
        (
            27
            +
            Math.floor(
                Math.random()
                *
                9
            )
        );


    const outerDistance =
        powerful
        ?
        165
        :
        (
            100
            +
            Math.random()
            *
            38
        );


    for (
        let i = 0;
        i < outerCount;
        i++
    ) {


        const angle =
            (
                Math.PI
                *
                2
                *
                i
            )
            /
            outerCount
            +
            (
                Math.random()
                -
                .5
            )
            *
            .10;


        const distance =
            outerDistance
            *
            (
                .78
                +
                Math.random()
                *
                .35
            );


        const color =
            palette[
                Math.floor(
                    Math.random()
                    *
                    palette.length
                )
            ];


        createCurvedPath(

            group,

            angle,

            distance,

            color,

            powerful,

            false

        );

    }


    const innerCount =
        powerful
        ?
        26
        :
        17;


    const innerDistance =
        powerful
        ?
        96
        :
        68;


    for (
        let i = 0;
        i < innerCount;
        i++
    ) {


        const angle =
            (
                Math.PI
                *
                2
                *
                i
            )
            /
            innerCount
            +
            .05;


        const distance =
            innerDistance
            *
            (
                .82
                +
                Math.random()
                *
                .28
            );


        const color =
            palette[
                (
                    i
                    +
                    1
                )
                %
                palette.length
            ];


        createCurvedPath(

            group,

            angle,

            distance,

            color,

            powerful,

            true

        );

    }


    const sparkCount =
        powerful
        ?
        23
        :
        11;


    for (
        let i = 0;
        i < sparkCount;
        i++
    ) {


        createFallingSpark(

            group,

            1
            +
            Math.random()
            *
            1.5,

            powerful

        );

    }


    setTimeout(

        () => {

            group.remove();

        },

        2500

    );

}


/* ==================================================
   均匀中速烟花
================================================== */

function startFireworks() {


    const positions = [

        [15, 27],

        [82, 23],

        [30, 17],

        [70, 37],

        [12, 49],

        [88, 47],

        [48, 14],

        [23, 35],

        [76, 32],

        [38, 25],

        [62, 21]

    ];


    let positionIndex =
        0;


    createFirework(
        positions[0][0],
        positions[0][1]
    );


    positionIndex =
        1;


    fireworksTimer =
        setInterval(

            () => {


                const position =
                    positions[
                        positionIndex
                    ];


                createFirework(

                    position[0],

                    position[1]

                );


                positionIndex++;


                if (
                    positionIndex
                    >=
                    positions.length
                ) {

                    positionIndex =
                        0;

                }

            },

            FIREWORK_INTERVAL

        );

}


/* ==================================================
   点击打开贺卡
================================================== */

openCardButton.addEventListener(

    "click",

    function () {


        openCardButton.disabled =
            true;


        openCardButton.textContent =
            "✨ 正在打开属于你的惊喜…";


        if (
            fireworksTimer
        ) {


            clearInterval(
                fireworksTimer
            );


            fireworksTimer =
                null;

        }


        const finale = [

            [15, 27],

            [82, 24],

            [32, 18],

            [68, 18],

            [50, 12]

        ];


        finale.forEach(

            (
                position,
                index
            ) => {


                setTimeout(

                    () => {


                        createFirework(

                            position[0],

                            position[1],

                            true

                        );

                    },

                    index
                    *
                    FIREWORK_INTERVAL

                );

            }

        );


        setTimeout(

            () => {


                cakeScreen.classList.add(
                    "leave"
                );

            },

            3500

        );


        setTimeout(

            () => {


                cakeScreen.classList.remove(
                    "show"
                );


                cakeScreen.style.display =
                    "none";


                birthdayCard.classList.add(
                    "show"
                );


                startHearts();

            },

            4600

        );

    }

);


/* ==================================================
   贺卡漂浮元素
================================================== */

let heartTimer =
    null;


function createHeart() {


    const heart =
        document.createElement(
            "div"
        );


    heart.className =
        "floating-heart";


    const hearts = [

        "🩵",

        "💙",

        "🤍",

        "♡",

        "✨",

        "✦"

    ];


    heart.textContent =
        hearts[
            Math.floor(
                Math.random()
                *
                hearts.length
            )
        ];


    heart.style.left =
        Math.random()
        *
        100
        +
        "vw";


    heart.style.fontSize =
        (
            14
            +
            Math.random()
            *
            22
        )
        +
        "px";


    heart.style.animationDuration =
        (
            5
            +
            Math.random()
            *
            5
        )
        +
        "s";


    document.body.appendChild(
        heart
    );


    setTimeout(

        () => {

            heart.remove();

        },

        10000

    );

}


/* ==================================================
   开始爱心
================================================== */

function startHearts() {


    if (
        heartTimer
    ) {

        return;

    }


    heartTimer =
        setInterval(

            createHeart,

            420

        );


    for (
        let i = 0;
        i < 15;
        i++
    ) {


        setTimeout(

            createHeart,

            i * 100

        );

    }

}


/* ==================================================
   点击显示隐藏情话
================================================== */

loveButton.addEventListener(

    "click",

    function () {


        const note =
            document.getElementById(
                "note"
            );


        note.classList.toggle(
            "show"
        );


        for (
            let i = 0;
            i < 24;
            i++
        ) {


            setTimeout(

                createHeart,

                i * 50

            );

        }

    }

);
