<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生日快乐 ❤️</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.45), transparent 28%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.25), transparent 30%),
        linear-gradient(135deg, #ff8fb1 0%, #ff5d8f 45%, #d94075 100%);
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      padding: 28px 16px;
    }

    .glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, rgba(255,255,255,.18), transparent 55%);
    }

    .card {
      width: min(760px, 94vw);
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 44px 28px 36px;
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 28px;
      background: rgba(255,255,255,.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 24px 70px rgba(83, 0, 34, .28);
    }

    .small {
      letter-spacing: .25em;
      font-size: 14px;
      opacity: .88;
      margin-bottom: 10px;
    }

    h1 {
      margin: 6px 0 10px;
      font-size: clamp(42px, 9vw, 82px);
      line-height: 1.02;
      text-shadow: 0 6px 20px rgba(120,0,45,.28);
    }

    .date {
      display: inline-block;
      margin: 8px 0 26px;
      padding: 9px 18px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      font-weight: 600;
    }

    .heart {
      font-size: 54px;
      display: inline-block;
      animation: beat 1.05s infinite ease-in-out;
      filter: drop-shadow(0 5px 12px rgba(120,0,40,.28));
    }

    @keyframes beat {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.12); }
      40% { transform: scale(.96); }
      60% { transform: scale(1.16); }
    }

    .message {
      max-width: 610px;
      margin: 18px auto 0;
      font-size: clamp(17px, 3.4vw, 21px);
      line-height: 1.9;
      text-wrap: pretty;
    }

    .signature {
      margin-top: 28px;
      font-size: 15px;
      opacity: .9;
    }

    .btn {
      margin-top: 24px;
      border: 0;
      padding: 12px 22px;
      border-radius: 999px;
      background: #fff;
      color: #d93e73;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(108,0,38,.18);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(108,0,38,.24); }

    .hidden-note {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height .8s ease, opacity .8s ease, margin-top .8s ease;
      margin-top: 0;
      font-size: 18px;
      line-height: 1.8;
    }

    .hidden-note.show {
      max-height: 260px;
      opacity: 1;
      margin-top: 22px;
    }

    .floating-heart {
      position: fixed;
      bottom: -40px;
      z-index: 1;
      pointer-events: none;
      animation: floatUp linear forwards;
      user-select: none;
      filter: drop-shadow(0 3px 8px rgba(120,0,45,.18));
    }

    @keyframes floatUp {
      from { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: .95; }
      to { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
    }

    .sparkle {
      position: absolute;
      inset: auto;
      pointer-events: none;
      font-size: 20px;
      animation: twinkle 1.8s infinite ease-in-out;
    }
    .s1 { top: 18px; left: 24px; animation-delay: .1s; }
    .s2 { top: 34px; right: 32px; animation-delay: .8s; }
    .s3 { bottom: 26px; left: 36px; animation-delay: .45s; }
    .s4 { bottom: 30px; right: 30px; animation-delay: 1.15s; }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.8) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.2) rotate(18deg); }
    }

    @media (max-width: 520px) {
      .card { padding: 36px 20px 30px; border-radius: 22px; }
      .message { line-height: 1.75; }
    }
  </style>
</head>
<body>
  <div class="glow"></div>

  <main class="card">
    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">✧</span>
    <span class="sparkle s3">✧</span>
    <span class="sparkle s4">✦</span>

    <div class="small">TO MY FAVORITE PERSON</div>
    <div class="heart">❤️</div>
    <h1>生日快乐</h1>
    <div class="date">9月1日 · 属于你的特别一天</div>

    <div class="message">
      亲爱的你，<br>
      很幸运可以陪你走过又一岁的开始。<br>
      希望你的每一天都有鲜花、拥抱和好心情，
      希望你想要的都会慢慢来到你身边。<br>
      谢谢你出现在我的世界里。<br>
      <strong>生日快乐，我会一直爱你。❤️</strong>
    </div>

    <button class="btn" onclick="showLove()">点一下，有句话想对你说</button>

    <div id="note" class="hidden-note">
      世界很大，但我最想去的地方，是有你的未来。<br>
      愿往后的每一个生日，我都能陪在你身边。💗
    </div>

    <div class="signature">— 爱你的人</div>
  </main>

  <script>
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";
      const hearts = ["❤", "💗", "💕", "💖", "💘"];
      heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (14 + Math.random() * 24) + "px";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }

    setInterval(createHeart, 380);
    for (let i = 0; i < 10; i++) setTimeout(createHeart, i * 140);

    function showLove() {
      const note = document.getElementById("note");
      note.classList.toggle("show");
      for (let i = 0; i < 16; i++) setTimeout(createHeart, i * 65);
    }
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/v3d52b47920f24c319d37e2661827c42b1787588026925" integrity="sha512-d9sL6GJLXn6fInD1+TVXhTcQOsmxeHfmHAvwGDIxp5TO+uo1fiWW7mHomMj4MLRlCsJDTqXzWLHJFFlPCEIj/A==" data-cf-beacon='{"version":"2024.11.0","token":"7939e04a4baf43c8b86a560f74aac60e"}' crossorigin="anonymous"></script>
</body>
</html>
